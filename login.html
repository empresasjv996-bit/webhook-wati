<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QGC TEAM - Login</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-grid"></div>
    <div class="aurora-bg"></div>

    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="logo-qgc.png.jpeg" class="logo-img" alt="QGC" onerror="this.style.display='none'">
                <h1><span>QGC</span> TEAM</h1>
            </div>
            <p class="subtitle">Acesse sua conta para continuar</p>

            <form id="loginForm">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="admin@qgcteam.com" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = document.querySelector('.btn-login');

            btn.textContent = 'Verificando...';
            btn.style.opacity = '0.7';

            try {
                // Envia os dados de forma segura para o servidor
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (data.success) {
                    // O servidor já salvou o token no Cookie. Só precisamos redirecionar.
                    window.location.href = data.role === 'admin' ? '/admin' : '/colaborador';
                } else {
                    alert(data.message);
                    btn.textContent = 'Entrar no Sistema';
                    btn.style.opacity = '1';
                }
            } catch (error) {
                alert('Erro ao conectar com o servidor.');
                btn.textContent = 'Entrar no Sistema';
                btn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
