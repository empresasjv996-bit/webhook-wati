<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QGC TEAM by JV - Atendimento</title>
    <link rel="stylesheet" href="colaborador.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-grid"></div>
    <div class="aurora-bg"></div>

    <div class="app-container">
        
        <header class="top">
            <div class="logo">
                <img src="logo-qgc.png.jpeg" class="logo-img" alt="QGC TEAM by JV" onerror="this.style.display='none'">
                <span>QGC</span> TEAM <small>by JV</small>
            </div>
            
            <div class="status">
                <span class="dot"></span> ONLINE
            </div>

            <div class="top-actions">
                <div class="user-info">
                    <span id="nome-atendente">Carregando...</span>
                    <div class="avatar" id="avatar-atendente">C</div>
                </div>
                <form action="/api/logout" method="POST" style="display:inline; margin:0; padding:0;">
                    <button type="submit" class="btn-sair" style="background:none; border: 1px solid var(--border); color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer;">Sair</button>
                </form>
            </div>
        </header>

        <main class="workspace">
            
            <aside class="sidebar">
                <div class="filters">
                    <button class="active" data-filtro="ativos">Aguardando</button>
                    <button data-filtro="todos">Todos</button>
                    <button data-filtro="finalizados">Finalizados</button>
                </div>
                
                <div class="search-box">
                    <input id="busca-contatos" type="text" placeholder="Pesquisar contato...">
                </div>

                <div class="contact-list" id="lista-contatos">
                    <!-- Contatos via JS -->
                </div>
            </aside>

            <section class="chat-area">
                <div class="chat-header">
                    <div class="avatar" id="chat-avatar">?</div>
                    <div>
                        <h2 id="chat-nome">Nenhum cliente</h2>
                        <p id="chat-telefone">Selecione um contato</p>
                    </div>
                    <button class="btn-finalizar" onclick="finalizarAtendimento()">Finalizar Atendimento</button>
                </div>

                <div class="messages" id="mensagens">
                    <!-- Mensagens via JS -->
                </div>

                <div class="input-area">
                    <input type="text" id="input-mensagem" placeholder="Digite sua mensagem...">
                    <button onclick="enviarMensagem()" title="Enviar" aria-label="Enviar">&#10148;</button>
                </div>
            </section>

            <aside class="client-panel">
                <h3>Ficha do Cliente</h3>
                
                <div class="info-group">
                    <label>Nome</label>
                    <p id="ficha-nome">-</p>
                </div>
                <div class="info-group">
                    <label>Telefone</label>
                    <p id="ficha-telefone">-</p>
                </div>

                <div class="info-group">
                    <label>Dados da empresa</label>
                    <ul id="ficha-atributos" class="ficha-atributos">
                        <li><span>Selecione um contato</span></li>
                    </ul>
                </div>

            </aside>

        </main>
    </div>

    <script src="colaborador.js"></script>
</body>
</html>
