<script>
    let clienteAtivo = null;

    // Função para carregar os clientes do banco de dados
    async function carregarClientes() {
        try {
            const response = await fetch('/api/clientes');
            const clientes = await response.json();
            const contactList = document.querySelector('.contact-list');
            
            contactList.innerHTML = ''; // Limpa a lista

            if (clientes.length === 0) {
                contactList.innerHTML = '<p style="padding:20px; color:var(--text-muted); text-align:center;">Nenhum cliente no banco.</p>';
                return;
            }

            clientes.forEach((cliente, index) => {
                const iniciais = cliente.nome.substring(0, 2).toUpperCase();
                const isAtivo = index === 0 ? 'active' : '';
                
                // Monta o HTML do card do contato
                const html = `
                    <div class="contact-item ${isAtivo}" onclick="abrirCliente(this, '${cliente.nome}', '${cliente.telefone}', '${cliente.mensagem}')">
                        <div class="avatar">${iniciais}</div>
                        <div class="contact-info">
                            <h4>${cliente.nome}</h4>
                            <p>${cliente.mensagem || 'Sem mensagem'}</p>
                        </div>
                        <span class="time">Agora</span>
                    </div>
                `;
                contactList.innerHTML += html;
            });

            // Abre o primeiro cliente automaticamente
            if (clientes.length > 0) {
                const primeiroItem = document.querySelector('.contact-item');
                abrirCliente(primeiroItem, clientes[0].nome, clientes[0].telefone, clientes[0].mensagem);
            }

        } catch (error) {
            console.error('Erro ao carregar clientes:', error);
        }
    }

    // Função quando clica em um contato da lista
    function abrirCliente(element, nome, telefone, mensagem) {
        // Atualiza a classe active nos contatos
        document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');

        clienteAtivo = { nome, telefone };

        // Atualiza o header do chat e a ficha
        document.querySelector('.chat-header h2').textContent = nome;
        document.querySelector('.chat-header p').textContent = `Telefone: ${telefone}`;
        document.querySelector('.client-panel .info-group:nth-child(1) p').textContent = nome;
        document.querySelector('.client-panel .info-group:nth-child(2) p').textContent = telefone;

        // Adiciona a mensagem no chat
        const chat = document.querySelector('.messages');
        chat.innerHTML = `
            <div class="message received">
                <p>${mensagem}</p>
                <span>Agora</span>
            </div>
        `;
    }

    // Quando o colaborador clica no status
    const statusButtons = document.querySelectorAll('.status-btn');
    statusButtons.forEach(button => {
        button.addEventListener('click', async () => {
            if (!clienteAtivo) return;

            statusButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            let statusValue = 'pensando';
            if (button.classList.contains('vendido')) statusValue = 'vendido';
            if (button.classList.contains('nao-quis')) statusValue = 'nao-quis';

            try {
                await fetch('/api/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        telefone: clienteAtivo.telefone, // Agora usa o telefone real!
                        status: statusValue 
                    })
                });
                console.log('Status atualizado no banco:', statusValue);
            } catch (error) {
                console.error('Erro ao salvar:', error);
            }
        });
    });

    // Inicia a busca de clientes quando a página carregar
    window.onload = carregarClientes;
</script>
